<!DOCTYPE html>
<html lang="ar" dir="rtl" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>دفتر</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#1E5A3C">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&display=swap">
<style>
:root{--bg:#EEF0EC;--card:#fff;--ink:#1B2620;--mute:#6B766F;--green:#1E5A3C;--green-s:#E1EFE6;--red:#B4473F;--red-s:#F6E4E1;--line:#DDE2DC;--shadow:0 1px 2px rgba(20,40,30,.08);--acc:#1E5A3C;--on:#fff;--ease:cubic-bezier(.32,.72,0,1);box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#121815;--card:#1B231F;--ink:#E8EEE9;--mute:#93A099;--green:#5FBF8A;--green-s:#1D3328;--red:#E0877F;--red-s:#3A2220;--line:#2B3631;--shadow:none;--acc:#5FBF8A;--on:#fff}}
:root[data-theme="dark"]{--bg:#121815;--card:#1B231F;--ink:#E8EEE9;--mute:#93A099;--green:#5FBF8A;--green-s:#1D3328;--red:#E0877F;--red-s:#3A2220;--line:#2B3631;--shadow:none;--acc:#5FBF8A;--on:#fff}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font-family:Tajawal,"Segoe UI",Tahoma,sans-serif;overflow:hidden}
button,input,textarea{font:inherit;color:inherit}
button{border:0;background:none;cursor:pointer;touch-action:manipulation}
.screen{position:absolute;inset:0;display:flex;flex-direction:column;background:var(--bg);transition:transform .42s var(--ease),opacity .42s var(--ease);will-change:transform;backface-visibility:hidden}
#detail{transform:translate3d(-100%,0,0);z-index:5;visibility:hidden;transition:transform .42s var(--ease),visibility 0s linear .42s}
#detail.open{transform:none;visibility:visible;transition:transform .42s var(--ease),visibility 0s}
#home.under{transform:translate3d(22%,0,0);opacity:.55}
header{display:flex;align-items:center;justify-content:space-between;padding:14px 18px;background:var(--acc);color:var(--on)}
header h1{margin:0;font-size:24px;font-weight:800}
header .ib{color:var(--on);width:40px;height:40px;border-radius:50%;font-size:20px}
.scroll{flex:1;overflow-y:auto;overscroll-behavior:contain;-webkit-overflow-scrolling:touch;padding:14px 14px 100px}
.sum{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:14px}
.sum .c{background:var(--card);border-radius:14px;padding:12px;box-shadow:var(--shadow)}
.sum .c.wide{grid-column:1/-1;display:flex;justify-content:space-between;align-items:center}
.sum small{color:var(--mute);font-size:13px}
.sum b{display:block;font-size:22px;margin-top:2px}
.owe{color:var(--red)} .paid{color:var(--green)}
.search{width:100%;padding:11px 14px;border-radius:12px;border:1px solid var(--line);background:var(--card)}
.srow{display:flex;gap:8px;margin-bottom:12px}
.srow .search{flex:1;width:auto;min-width:0}
.gear{width:46px;flex:none;border-radius:12px;background:var(--card);border:1px solid var(--line);font-size:21px;color:var(--green)}
.cust{display:flex;align-items:center;gap:12px;width:100%;text-align:right;background:var(--card);border-radius:14px;padding:13px;margin-bottom:9px;box-shadow:var(--shadow);position:relative;overflow:hidden}
.cust.new{animation:enter .45s var(--ease) backwards}
@keyframes enter{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
.av{width:42px;height:42px;border-radius:50%;background:var(--green-s);color:var(--green);display:grid;place-items:center;font-weight:800;flex:none}
.cust .m{flex:1;min-width:0}
.cust .n{font-weight:700;font-size:17px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tag{font-size:12px;padding:2px 9px;border-radius:99px;display:inline-block;margin-top:3px}
.tag.o{background:var(--red-s);color:var(--red)} .tag.z{background:var(--green-s);color:var(--green)}
.cust .a{font-weight:800;font-size:18px}
.rip span{position:absolute;border-radius:50%;background:currentColor;opacity:.18;transform:scale(0);animation:rp .5s ease-out forwards;pointer-events:none}
@keyframes rp{to{transform:scale(1);opacity:0}}
.empty{text-align:center;color:var(--mute);padding:50px 20px;line-height:1.9}
.fab{position:absolute;bottom:calc(22px + env(safe-area-inset-bottom,0px));right:20px;width:60px;height:60px;border-radius:50%;background:var(--acc);color:var(--on);font-size:32px;box-shadow:0 6px 16px rgba(20,60,40,.35);transition:transform .2s var(--ease);z-index:3}
.fab:active{transform:scale(.9)}
.big{background:var(--card);margin:14px;border-radius:16px;padding:16px;box-shadow:var(--shadow)}
.big h2{margin:0;font-size:22px} .big .ph{color:var(--mute);direction:ltr;text-align:right}
.big .tot{font-size:38px;font-weight:800;margin-top:8px}
.tx{display:flex;gap:12px;padding:12px 0;border-bottom:1px solid var(--line)}
.tx:last-child{border:0}
.dot{width:10px;border-radius:6px;flex:none}
.dot.d{background:var(--red)} .dot.p{background:var(--green)}
.tx .m{flex:1} .tx .t{font-weight:700} .tx .s{color:var(--mute);font-size:13px}
.tx .x{color:var(--mute);width:34px;height:34px;border-radius:50%}
.tl{margin:0 14px;background:var(--card);border-radius:16px;padding:4px 16px;box-shadow:var(--shadow)}
.bar{display:flex;gap:10px;padding:12px 14px;background:var(--card);border-top:1px solid var(--line)}
.btn{flex:1;padding:14px;border-radius:12px;font-weight:700;position:relative;overflow:hidden}
.btn.g{background:var(--acc);color:var(--on)} .btn.w{background:#25D366;color:#073b1a}
.btn.l{background:var(--bg)} .btn.r{background:var(--red);color:#fff}
.brow{display:flex;align-items:center;gap:10px}.brow .nm{flex:1;min-width:0}
.back{color:var(--ink);font-size:22px;width:38px;height:38px;flex:none;border-radius:50%;background:var(--bg)}
.del{color:var(--red);font-weight:700;font-size:14px;padding:8px 12px;border-radius:10px;border:1px solid var(--red);flex:none}
.shade{position:absolute;inset:0;background:rgba(0,0,0,.45);opacity:0;visibility:hidden;transition:opacity .35s ease,visibility 0s linear .35s;will-change:opacity;z-index:8}
.shade.on{opacity:1;visibility:visible;transition:opacity .35s ease,visibility 0s}
.sheet{position:absolute;left:0;right:0;bottom:0;background:var(--card);border-radius:22px 22px 0 0;padding:18px 18px calc(18px + env(safe-area-inset-bottom,0px));transform:translate3d(0,105%,0);will-change:transform;z-index:9;max-height:90%;overflow-y:auto}
.sheet.on{transform:none}
.sheet h3{margin:0 0 12px;font-size:20px}
.f{display:block;margin-bottom:12px;font-size:14px;color:var(--mute)}
.f input,.f textarea{display:block;width:100%;margin-top:4px;padding:12px;border-radius:10px;border:1.5px solid var(--line);background:var(--bg);font-size:17px}
.f input:focus,.f textarea:focus{outline:2px solid var(--green);border-color:transparent}
.f .err{display:none;color:var(--red);font-size:13px;margin-top:3px}
.f.bad input{border-color:var(--red)} .f.bad .err{display:block}
.shake{animation:shake .4s}
@keyframes shake{20%,60%{transform:translateX(-7px)}40%,80%{transform:translateX(7px)}}
.seg{display:flex;gap:8px;margin-bottom:12px}
.seg button{flex:1;padding:11px;border-radius:10px;background:var(--bg);font-weight:700;border:2px solid transparent}
.seg button.on.d{background:var(--red-s);color:var(--red);border-color:var(--red)}
.seg button.on.p{background:var(--green-s);color:var(--green);border-color:var(--green)}
#toast{position:absolute;bottom:calc(96px + env(safe-area-inset-bottom,0px));left:50%;transform:translate(-50%,20px);background:var(--ink);color:var(--bg);padding:11px 20px;border-radius:99px;opacity:0;transition:opacity .25s,transform .25s;z-index:20;pointer-events:none;white-space:nowrap;font-size:15px}
#toast.on{opacity:1;transform:translate(-50%,0)}
.chips{display:flex;gap:8px;margin-bottom:12px;overflow-x:auto}.chip{flex:none;padding:7px 14px;border-radius:99px;background:var(--card);border:1px solid var(--line);font-size:14px}.chip.on{background:var(--acc);color:var(--on);border-color:var(--acc)}
.tag.l{background:var(--red);color:#fff}
.tx{cursor:pointer}.del.ed{color:var(--green);border-color:var(--green)}
.bar.three{gap:8px}.bar.three .btn{font-size:14px;padding:13px 4px}
.row2{display:flex;gap:8px;margin-bottom:12px}.f textarea.bk{height:90px;direction:ltr;font-size:12px}
#lock{position:absolute;inset:0;z-index:30;background:var(--bg);display:none;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:30px}#lock.on{display:flex}#lock h2{margin:0;font-size:30px}#lock input{width:210px;text-align:center;font-size:28px;letter-spacing:8px;padding:12px;border-radius:12px;border:1.5px solid var(--line);background:var(--card)}
input[data-n]{text-align:right;direction:ltr}
input[data-d]{text-align:right;direction:ltr}
html,body{touch-action:pan-x pan-y;-webkit-text-size-adjust:100%;text-size-adjust:100%}
body{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
input,textarea{-webkit-user-select:text;user-select:text}
html,body{position:fixed;inset:0;width:100%;overflow:hidden;overscroll-behavior:none}
#app{position:fixed;inset:0;overflow:hidden}
.sheet{visibility:hidden;transition:transform .45s var(--ease),visibility 0s linear .45s}.sheet.on{visibility:visible;transition:transform .45s var(--ease),visibility 0s}
#pdfbox{position:fixed;left:-10000px;top:0;width:794px;padding:44px;background:#fff;color:#14201a;direction:rtl;font-family:Tajawal,"Segoe UI",Tahoma,sans-serif;font-size:15px}#pdfbox h1{margin:0;font-size:30px;color:#1E5A3C}#pdfbox h2{margin:2px 0 18px;font-size:20px;color:#555;font-weight:500}#pdfbox h3{margin:24px 0 8px;font-size:17px}#pdfbox .meta{display:grid;gap:4px;margin-bottom:16px;padding:12px 14px;background:#EEF0EC;border-radius:8px}#pdfbox table{width:100%;border-collapse:collapse}#pdfbox th{background:#1E5A3C;color:#fff;padding:8px 10px;text-align:right;font-size:14px}#pdfbox td{padding:8px 10px;border-bottom:1px solid #DDE2DC;text-align:right}#pdfbox td.r{color:#B4473F;font-weight:700}#pdfbox td.g{color:#1E5A3C;font-weight:700}#pdfbox tr.pre td{background:#F4F6F3;color:#555}
.cbtn{flex:none;min-width:96px;padding:0 12px;border-radius:10px;border:1.5px solid var(--line);background:var(--bg);font-weight:700;font-size:17px;color:var(--ink);display:flex;align-items:center;justify-content:center;gap:6px}
.cbtn i{font-style:normal;color:var(--mute);font-size:12px}
.cbtn.wide{width:100%;min-height:50px;margin-top:4px;justify-content:space-between;padding:0 14px}
.cp{position:absolute;inset:0;z-index:12;background:rgba(0,0,0,.45);display:flex;align-items:flex-end;opacity:0;visibility:hidden;transition:opacity .3s ease,visibility 0s linear .3s}
.cp.on{opacity:1;visibility:visible;transition:opacity .3s ease,visibility 0s}
.cpbox{width:100%;max-height:75%;overflow-y:auto;background:var(--card);border-radius:22px 22px 0 0;padding:14px 14px calc(14px + env(safe-area-inset-bottom,0px));transform:translate3d(0,60px,0);transition:transform .4s var(--ease)}
.cp.on .cpbox{transform:none}
.cpbox h4{margin:2px 4px 10px;font-size:18px}
.cprow{display:flex;align-items:center;gap:12px;width:100%;padding:10px;border-radius:12px;text-align:right}
.cprow b{width:46px;height:46px;border-radius:50%;background:var(--green-s);color:var(--green);display:grid;place-items:center;font-size:15px;flex:none}
.cprow span{flex:1;font-weight:700;font-size:16px}
.cprow small{display:block;color:var(--mute);font-weight:500;font-size:12px;direction:ltr;text-align:right}
.cprow em{font-style:normal;color:var(--green);font-weight:800;width:22px}
.cprow.on{background:var(--green-s)}
.sum b{white-space:pre-line}.cust .a{text-align:left;line-height:1.35}
.amrow{display:flex;gap:8px;margin-top:4px}.amrow input{margin-top:0!important;flex:1;min-width:0}
.sel2{flex:none;width:116px;padding:0 6px;border-radius:10px;border:1.5px solid var(--line);background:var(--bg);font-size:15px;color:var(--ink)}
.sel{display:block;width:100%;margin-top:4px;padding:12px;border-radius:10px;border:1.5px solid var(--line);background:var(--bg);font-size:17px;color:var(--ink)}
#toast.u{pointer-events:auto}#toast.u button{color:inherit;text-decoration:underline;font-weight:800;padding:0 4px}
.rp{margin-bottom:14px;background:var(--bg);border-radius:12px;padding:8px 12px}.rp>b{display:block;padding:6px 0;color:var(--green)}.rr{display:flex;justify-content:space-between;gap:10px;padding:7px 0;border-bottom:1px solid var(--line);font-size:15px}.rr:last-child{border:0}
.cust,.btn,.chip,.cbtn,.cprow,.back{transition:transform .2s var(--ease),background-color .2s}
.cust:active{transform:scale(.975)}.btn:active{transform:scale(.96)}.chip:active,.cbtn:active{transform:scale(.94)}.back:active{transform:scale(.88)}
.tt,.tt *{transition:background-color .4s ease,color .4s ease,border-color .4s ease,box-shadow .4s ease!important}
.sws{display:flex;flex-wrap:wrap;gap:10px;margin-top:8px}
.sw{width:38px;height:38px;border-radius:50%;border:3px solid var(--card);box-shadow:0 0 0 1.5px var(--line);position:relative;flex:none;display:block;padding:0;transition:transform .25s var(--ease),box-shadow .25s}
.sw.on{box-shadow:0 0 0 2.5px var(--ink);transform:scale(1.1)}
.sw.cu{background:conic-gradient(#e53935,#fdd835,#43a047,#00acc1,#1e88e5,#8e24aa,#e53935);overflow:hidden}
.sw.cu::after{content:"✎";position:absolute;inset:0;display:grid;place-items:center;color:#fff;font-size:15px;text-shadow:0 0 3px rgba(0,0,0,.7);pointer-events:none}
.f .sw.cu input{position:absolute;inset:0;width:100%;height:100%;opacity:0;margin:0;padding:0;border:0;cursor:pointer}
.nb{text-align:center!important}.un{align-self:center;color:var(--mute);font-size:16px;flex:none}
.qd{display:flex;flex-wrap:wrap;gap:8px;margin:6px 0 10px}
.dh{font-size:13px;color:var(--mute);min-height:18px;margin-top:6px}
.dn{position:absolute;opacity:0;pointer-events:none;width:1px;height:1px;border:0;padding:0}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition-duration:.01ms!important}}
</style>
</head>
<body>
<div id="app">
 <section class="screen" id="home">
  <div class="scroll">
   <div class="sum">
    <div class="c"><small>الديون لنا</small><b class="owe" id="sOwed">0</b></div>
    <div class="c"><small>الديون علينا</small><b class="paid" id="sWeOwe">0</b></div>
    <div class="c wide"><small>عدد الزبائن</small><b id="sCount">0</b></div>
   </div>
   <div class="srow"><input class="search" id="q" placeholder="بحث عن زبون…" autocomplete="off"><button class="gear" id="shopBtn" aria-label="الإعدادات">⚙</button></div>
   <div class="chips" id="chips"></div>
   <div id="list"></div>
  </div>
  <button class="fab" id="fab" aria-label="إضافة زبون جديد">+</button>
 </section>
 <section class="screen" id="detail">
  <div class="scroll" style="padding:0 0 20px">
   <div class="big"><div class="brow"><button class="back" id="backBtn" aria-label="رجوع">→</button><div class="nm"><h2 id="dName"></h2><div class="ph" id="dPhone"></div></div><button class="del ed" id="edCust">تعديل</button><button class="del" id="delCust">حذف</button></div><div class="tot" id="dTot"></div><button type="button" class="btn g rip" id="payAll" style="width:100%;margin-top:12px;display:none">✓ تسديد كامل المبلغ</button></div>
   <div class="tl" id="tx"></div>
  </div>
  <div class="bar three"><button class="btn g rip" id="addTx">دين / دفعة</button><button class="btn w rip" id="wa">تذكير</button><button class="btn l rip" id="st">كشف حساب</button></div>
 </section>
 <div class="shade" id="shade"></div>
 <div class="sheet" id="sheet"></div>
 <div class="cp" id="cp"><div class="cpbox" id="cpbox"></div></div>
 <div id="lock"><h2>دفتر</h2><input id="pin" type="password" inputmode="numeric" maxlength="8" autocomplete="off" placeholder="••••"><div id="pe" style="color:var(--red);min-height:22px"></div></div>
 <div id="toast"></div>
</div>
<script>
(function(){
var $=function(i){return document.getElementById(i)};
var dueUpd=null,data={shop:"محلي",customers:[]}, seen={}, fl='all', so=0, db=null, cur=null, armed=false, armT=null;
var num=function(n){return Number(n).toLocaleString("ar-EG-u-nu-latn")};
var fmt=function(n,c){var u=c===undefined?cc(cur):c;return Number(n).toLocaleString("ar-EG-u-nu-latn",{maximumFractionDigits:2})+(u?" "+u:"")};
function cc(c){return (c&&c.cu)||dc()}
var esc=function(s){var d=document.createElement("div");d.textContent=s==null?"":s;return d.innerHTML};
var uid=function(){return Date.now().toString(36)+Math.random().toString(36).slice(2,6)};

/* ---------- التخزين: IndexedDB مع بديل في الذاكرة ---------- */
function openDB(){return new Promise(function(res){
 try{var r=indexedDB.open("daftar",1);
 r.onupgradeneeded=function(){r.result.createObjectStore("kv")};
 r.onsuccess=function(){db=r.result;res()};r.onerror=function(){res()};}catch(e){res()}})}
function load(){return new Promise(function(res){
 if(!db)return res();
 try{var g=db.transaction("kv").objectStore("kv").get("data");
 g.onsuccess=function(){if(g.result)data=g.result;res()};g.onerror=function(){res()};}catch(e){res()}})}
function save(){if(!db)return;try{db.transaction("kv","readwrite").objectStore("kv").put(data,"data")}catch(e){}}

/* ---------- أدوات ---------- */
function undoToast(m,fn){var t=$('toast'),b=document.createElement('button');t.textContent=m+' ';b.textContent='تراجع';b.onclick=function(){fn();t.classList.remove('on','u');toast('تمت الاستعادة',true)};t.append(b);t.classList.add('on','u');clearTimeout(t._h);t._h=setTimeout(function(){t.classList.remove('on','u')},5000)}
function toast(m,quiet){var t=$("toast");t.classList.remove('u');t.textContent=m;t.classList.add("on");clearTimeout(t._h);t._h=setTimeout(function(){t.classList.remove("on")},2000);
 if(!quiet&&navigator.vibrate){try{navigator.vibrate(40)}catch(e){}}}
function bal(c){return c.tx.reduce(function(s,t){return s+(t.type==="debt"?t.amt:-t.amt)},0)}
function ripple(e){var el=e.currentTarget,r=el.getBoundingClientRect(),s=Math.max(r.width,r.height)*2,sp=document.createElement("span");
 sp.style.cssText="width:"+s+"px;height:"+s+"px;left:"+(e.clientX-r.left-s/2)+"px;top:"+(e.clientY-r.top-s/2)+"px";
 el.appendChild(sp);setTimeout(function(){sp.remove()},520)}
function bindRip(){document.querySelectorAll(".rip").forEach(function(el){if(!el._r){el._r=1;el.addEventListener("pointerdown",ripple)}})}
function ymd(ts){return new Date(ts).toLocaleDateString("ar-EG-u-nu-latn",{day:"numeric",month:"short",year:"numeric"})}

/* ---------- الشاشة الرئيسية ---------- */
function renderHome(){
 var O={},W={};data.customers.forEach(function(c){var M=bals(c);Object.keys(M).forEach(function(k){var b=M[k];if(b>0)O[k]=(O[k]||0)+b;else if(b<0)W[k]=(W[k]||0)-b})});
 $("sOwed").textContent=sm(O);$("sWeOwe").textContent=sm(W);$("sCount").textContent=num(data.customers.length);
 var q=$("q").value.trim().toLowerCase();
 var arr=data.customers.filter(function(c){var b=Math.max.apply(null,Object.values(bals(c)).concat(0));return (!q||c.name.toLowerCase().indexOf(q)>-1||(c.phone||'').indexOf(q)>-1)&&(fl==='all'||(fl==='debt'&&b>0)||(fl==='late'&&late(c)))})
  .sort(function(a,b){return so===1?a.name.localeCompare(b.name,'ar'):so===2?la(b)-la(a):mag(b)-mag(a)});renderChips();
 var L=$("list");

function onState(s){

  if(armed){armT&&clearTimeout(armT);history.back();return}   // الضغطة الثانية: خروج فعلي
  armed=true;toast("اضغط مرة أخرى للخروج",true);history.pushState({s:"home"},"");
  armT=setTimeout(function(){armed=false},2000);return}

 closeSheetUI();
 if(s==="home"){$("detail").classList.remove("open");$("home").classList.remove("under");cur=null}
}
